<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1f2129" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Reader" />
    <!-- The manifest link + service worker are injected by vite-plugin-pwa. -->
    <title>Reader</title>
  </head>
  <body>
    <div id="app">
      <!-- Top bar -->
      <header id="topbar">
        <button id="btn-toc" class="icon-btn" aria-label="Chapters" title="Chapters">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path d="M4 6h16M4 12h16M4 18h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
        <div id="book-title" class="book-title">Reader</div>
        <div class="topbar-right">
          <button id="btn-prev" class="icon-btn" aria-label="Previous chapter" title="Previous" disabled>
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button id="btn-next" class="icon-btn" aria-label="Next chapter" title="Next" disabled>
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button id="btn-open" class="icon-btn" aria-label="Open EPUB" title="Open EPUB">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </header>

      <!-- Chapters drawer -->
      <div id="scrim" class="scrim" hidden></div>
      <nav id="drawer" class="drawer" aria-label="Chapters">
        <div class="drawer-head">Chapters</div>
        <ul id="toc-list" class="toc-list"></ul>
      </nav>

      <!-- Reading surface -->
      <main id="viewer-wrap">
        <div id="viewer"></div>
      </main>

      <!-- Landing / empty state -->
      <section id="landing" class="landing">
        <div class="landing-card">
          <div class="landing-mark">
            <svg viewBox="0 0 24 24" width="34" height="34" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H12v18H6.5A2.5 2.5 0 0 1 4 18.5v-13zM20 5.5A2.5 2.5 0 0 0 17.5 3H12v18h5.5A2.5 2.5 0 0 0 20 18.5v-13z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          </div>
          <h1>Your reader</h1>
          <p>Open an EPUB to start. It stays on this device — nothing is uploaded.</p>
          <button id="landing-open" class="primary-btn">Open EPUB</button>
          <p class="landing-hint">or drop a <code>.epub</code> file anywhere · <a id="landing-sample" href="#">try a sample</a></p>
        </div>
      </section>

      <input id="file-input" type="file" accept=".epub,application/epub+zip" hidden />
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
